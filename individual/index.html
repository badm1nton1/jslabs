<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instrument Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Instrument Shop</h1>

    <div class="form-box">
      <h2>Add Instrument</h2>
      <div class="form-row">
        <div>
          <input type="text" id="name" placeholder="Name (e.g. Fender Strat)">
          <span class="error" id="nameError"></span>
        </div>
        <div>
          <select id="type">
            <option value="">Select Type</option>
            <option value="Guitar">Guitar</option>
            <option value="Bass">Bass</option>
            <option value="Piano">Piano</option>
            <option value="Drums">Drums</option>
            <option value="Violin">Violin</option>
          </select>
          <span class="error" id="typeError"></span>
        </div>
        <div>
          <input type="number" id="price" placeholder="Price in $ (e.g. 500)" min="1">
          <span class="error" id="priceError"></span>
        </div>
      </div>
      <button id="addBtn">+ Add</button>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search by name...">
      <select id="sort">
        <option value="">Sort by...</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name">Name A-Z</option>
      </select>
    </div>

    <div id="tabs" class="tabs"></div>
    <p id="count" class="count"></p>
    <div id="list" class="list"></div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
